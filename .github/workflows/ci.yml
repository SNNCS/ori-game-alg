name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: Python regression checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        run: python -B -m unittest discover -s tests -p "test_*.py"

      - name: Verify architecture probes
        run: python -B verify_architecture.py

      - name: Run end-to-end gradient smoke test
        run: python -B demo.py
